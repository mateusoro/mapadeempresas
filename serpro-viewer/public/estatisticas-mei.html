<!-- Página: Estatísticas MEI -->
            <div id="page-estatisticas" class="page-section" style="display:none;">
                <div class="page-header">
                    <h2>Estatísticas MEI</h2>
                    <p>Dados consolidados de Microempreendedores Individuais</p>
                </div>

                <!-- Filtros -->
                <div class="mei-filters">
                    <div class="filter-group">
                        <label>Data Inicial</label>
                        <input type="date" id="filterDataInicio" onchange="loadEstatisticasMEI()">
                    </div>
                    <div class="filter-group">
                        <label>Data Final</label>
                        <input type="date" id="filterDataFim" onchange="loadEstatisticasMEI()">
                    </div>
                    <div class="filter-group">
                        <label>Estado (UF)</label>
                        <select id="filterUF" onchange="loadEstatisticasMEI()">
                            <option value="">Todos os Estados</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Município</label>
                        <select id="filterMunicipio" onchange="loadEstatisticasMEI()">
                            <option value="">Todos os Municípios</option>
                        </select>
                    </div>
                </div>

                <!-- Cards de Estatísticas -->
                <div class="stats-grid" id="statsGridMEI">
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-label">MEI Ativos</span>
                            <div class="stat-card-icon green">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                    <polyline points="22 4 12 14.01 9 11.01"/>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="meiAtivos">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-label">MEI Baixados</span>
                            <div class="stat-card-icon red">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="15" y1="9" x2="9" y2="15"/>
                                    <line x1="9" y1="9" x2="15" y2="15"/>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="meiBaixados">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-label">Total MEI no Período</span>
                            <div class="stat-card-icon blue">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                    <circle cx="9" cy="7" r="4"/>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                                </svg>
                            </div>
                        </div>
                        <div class="stat-card-value" id="meiTotal">-</div>
                    </div>
                </div>

                <!-- Tabela de Evolução Anual -->
                <div class="table-container">
                    <div class="table-header">
                        <span class="table-title">Evolução por Ano</span>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Ano</th>
                                    <th>Aberturas MEI</th>
                                    <th>Baixas MEI</th>
                                    <th>Saldo (Aberturas - Baixas)</th>
                                    <th>MEI Ativos no Período</th>
                                </tr>
                            </thead>
                            <tbody id="tableBodyEvolucaoAnual"></tbody>
                        </table>
                    </div>
                </div>
            </div>
